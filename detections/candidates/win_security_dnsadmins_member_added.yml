title: Member Added to DNS Admins Local Group
id: 5a0d5168-83d3-4532-b3bc-65e61656a2cc
status: experimental
description: Detects a member added to the DNS Admins security group.
author: Northstar Lab
date: 2026-09-23
logsource:
    product: windows
    service: security
detection:
    security:
        Channel: Security
    selection:
        EventID: 4732
        TargetUserName: 'DnsAdmins'
    condition: security and selection
