name: Cross-platform workbench checks
on: [push, pull_request]
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate scenarios and exercise the local workbench
        run: |
          python -m lab.validate scenarios/LAB-AI-001.json scenarios/LAB-AUTH-001.json scenarios/LAB-WEB-001.json
          python -m lab.workbench --prepare-only
          python smoke.py
          python smoke.py --imported
