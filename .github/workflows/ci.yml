name: Portable workbench checks
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax and run the synthetic demo
        env:
          LAB_DATA: ${{ runner.temp }}/northstar-data
          JEV_TEST: ${{ runner.temp }}/no-jev-test
        run: |
          bash -n quickstart.sh northstar.sh
          python -m sim.generate --date 2026-09-22 --seed 20260922
          python -m lab.validate scenarios/*.json
          python smoke.py
      - name: Check a third-party case import and decision replay
        env:
          LAB_DATA: ${{ runner.temp }}/northstar-data
          JEV_TEST: ${{ runner.temp }}/no-jev-test
          NORTHSTAR_SIM_CASES: ${{ runner.temp }}/no-sim-cases.jsonl
          NORTHSTAR_RESULTS: examples/typed-results.jsonl
        run: |
          python -m lab.import_cases --input examples/cases.jsonl
          python smoke.py --imported
